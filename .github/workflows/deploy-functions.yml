name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Nome de uma função específica (opcional). Deixe vazio para implantar todas.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: nmjssxbneqepqonvcvoe

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN não configurado nos secrets do repositório"
            exit 1
          fi

          # Deploy manual de uma função específica via workflow_dispatch
          if [[ -n "${{ github.event.inputs.function }}" ]]; then
            FN="${{ github.event.inputs.function }}"
            echo "::notice::Implantando apenas a função '$FN' (manual)"
            supabase functions deploy "$FN" --project-ref "$SUPABASE_PROJECT_REF"
            exit 0
          fi

          # Deploy automático: todas as funções em supabase/functions/, ignorando _shared/
          cd supabase/functions
          failed=()
          for dir in */; do
            fn="${dir%/}"
            if [[ "$fn" == _* ]]; then continue; fi
            if [[ ! -f "$fn/index.ts" ]]; then
              echo "::warning::Pulando '$fn' — sem index.ts"
              continue
            fi
            echo "::group::Deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              failed+=("$fn")
            fi
          done

          if (( ${#failed[@]} > 0 )); then
            echo "::error::Falha ao implantar: ${failed[*]}"
            exit 1
          fi

          echo "::notice::Todas as funções foram implantadas com sucesso."
